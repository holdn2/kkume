spring.application.name=server

# 스키마는 Flyway 가 소유한다. Hibernate 는 만들지 않고 맞는지만 본다.
# ddl-auto=update 로 두면 마이그레이션 없이 컬럼이 조용히 생겨서,
# 운영 DB 와 마이그레이션 파일이 어긋나도 아무도 모르게 된다.
spring.jpa.hibernate.ddl-auto=validate

# 뷰 렌더링까지 영속성 컨텍스트를 열어두지 않는다. 커넥션을 오래 쥐고 있게 되고
# 지연 로딩이 컨트롤러 밖에서 터져 원인을 찾기 어려워진다.
spring.jpa.open-in-view=false

# 배포에서는 SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD 환경변수로 넣는다.
# 로컬은 compose.yaml 을 spring-boot-docker-compose 가 읽어 자동으로 채운다.

# 받아들일 구글 client id. ID 토큰의 aud 를 이것과 대조한다.
# 이 값이 없으면 다른 앱을 위해 발급된 구글 토큰도 통과하므로, 비어 있으면 기동하지 않는다.
# client id 는 앱에 박히는 공개 값이라 저장소에 두어도 된다. client secret 은 쓰지 않는다.
kkume.auth.google.client-ids=93992852944-9a2lqaidmev14r5jj93pj8e4btdf8qrh.apps.googleusercontent.com

# 애플 로그인(문서 075 · 076). aud 는 번들 ID — 네이티브 로그인이라 Services ID 가 아니다
kkume.auth.apple.client-ids=com.holdn2.kkume
kkume.auth.apple.team-id=3PW3FZG3GR
# 계정 삭제 때 애플 토큰 회수(App Store 5.1.1(v))에만 쓴다. 비면 로그인은 되고 회수만 건너뛴다(기동할 때 경고)
kkume.auth.apple.key-id=${KKUME_APPLE_KEY_ID:}
kkume.auth.apple.private-key=${KKUME_APPLE_PRIVATE_KEY:}

# 서버가 발급하는 토큰의 서명 키. 여기에 기본값을 두지 않는다 —
# 두면 저장소를 읽은 누구나 토큰을 위조할 수 있다.
# 비어 있으면 기동할 때마다 임시 키를 만들고 경고를 남긴다(재시작하면 로그인이 풀린다).
# 배포에서는 KKUME_JWT_SECRET 를 반드시 넣는다. 예: openssl rand -hex 32
kkume.auth.jwt.secret=${KKUME_JWT_SECRET:}

# 리프레시 토큰을 두지 않는 대신 수명을 넉넉히 잡는다.
# 새벽에 기록하려는데 로그인이 풀려 있으면 그 기록은 사라진다.
kkume.auth.jwt.ttl=30d

# 오디오 원본 보관(S3). 버킷이 비어 있으면 업로드를 받지 않는다(503 audio_unavailable) —
# 로컬에서 AWS 자격증명 없이 서버를 띄우는 경우다. 배포에서는 KKUME_AUDIO_BUCKET 으로 넣는다.
kkume.audio.bucket=${KKUME_AUDIO_BUCKET:}
kkume.audio.region=ap-southeast-2
# 가안. m4a(128kbps)로 약 26분, 받아쓰기 녹음 WAV(16kHz · 16bit · mono)로 약 13분
kkume.audio.max-bytes=26214400
kkume.audio.upload-ttl=15m

# 변환 작업 큐. 숫자는 전부 가안이다 — 변환 서비스의 실제 변환 시간을 보고 정한다.
# 변환기(SttTranscriber)가 없으면 일꾼은 작업을 받아 두기만 하고 돌리지 않는다.
kkume.stt.worker-enabled=true
kkume.stt.poll=5s
kkume.stt.max-attempts=3
kkume.stt.backoff=30s
kkume.stt.lease=10m
# 업로드가 끝나면 변환 작업을 만들지. 받아쓰기는 녹음하면서 기기가 한다(문서 048) — 서버는 녹음을 사본으로만 받는다
kkume.stt.enqueue=false

# 신고 알림 · 이용 정지(문서 070 · 072). 주제가 비어 있으면 알림을 보내지 않는다(로컬 · 테스트).
# 배포에서는 KKUME_REPORT_TOPIC_ARN 으로 넣는다.
kkume.moderation.topic-arn=${KKUME_REPORT_TOPIC_ARN:}
# 이용이 제한된 계정에 보여 줄 문의처. 약관의 이의 제기 주소와 같다
kkume.moderation.contact=yoocy01@gmail.com
